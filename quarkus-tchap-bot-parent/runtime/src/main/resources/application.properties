# Valeurs par défaut, à surcharger par l'application utilisatrice.
quarkus.tchap.sync.enabled=true
quarkus.tchap.sync.timeout=30000
quarkus.tchap.sync.initial-limit=20
quarkus.tchap.sync.store=memory
quarkus.tchap.bot.ignore-self-messages=true
quarkus.tchap.bot.auto-join-invited-rooms=false
quarkus.tchap.crypto.enabled=false
