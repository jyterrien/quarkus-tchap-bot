# Homeserver Tchap
quarkus.tchap.homeserver-url=${TCHAP_HOMESERVER_URL:https://matrix.agent.tchap.gouv.fr}

# Authentification du bot
quarkus.tchap.access-token=${TCHAP_ACCESS_TOKEN}
quarkus.tchap.user-id=${TCHAP_USER_ID}

# Synchronisation
quarkus.tchap.sync.enabled=true
quarkus.tchap.sync.timeout=30000
quarkus.tchap.sync.initial-limit=20
quarkus.tchap.sync.store=memory

# Comportement du bot
quarkus.tchap.bot.ignore-self-messages=true
quarkus.tchap.bot.auto-join-invited-rooms=false

# Crypto (hors MVP)
quarkus.tchap.crypto.enabled=false

# Logs
quarkus.log.category."fr.gouv.tchap".level=INFO

# Salon unique du bot
quarkus.tchap.rooms.integration.room=#BotsetIntgrationsTchapU2tHdMEN80D:agent.dinum.tchap.gouv.fr
quarkus.tchap.rooms.integration.required=false
